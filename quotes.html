  // Fisher-Yates shuffled queue — no repeat until all shown
  let queue = [];
  let currentIndex = -1;

  function buildQueue() {
    queue = [...Array(quotes.length).keys()];
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
  }

  function nextIndex() {
    if (queue.length === 0) buildQueue();
    return queue.pop();
  }

  function showQuote(idx, animate) {
    const card = document.getElementById('quoteCard');

    function render() {
      const q = quotes[idx];
document.getElementById('quoteText').textContent = q.text;

      const origEl = document.getElementById('quoteOriginal');
      if (q.original) { origEl.textContent = q.original; origEl.style.display = ''; }
      else { origEl.style.display = 'none'; }

      document.getElementById('quoteAttribution').textContent = q.author;

      const noteEl = document.getElementById('quoteNote');
      if (q.note) { noteEl.textContent = q.note; noteEl.style.display = ''; }
      else { noteEl.style.display = 'none'; }

    }

    if (animate) {
      card.classList.add('fade-out');
      setTimeout(() => {
        render();
        card.classList.remove('fade-out');
      }, 280);
    } else {
      render();
    }
  }

  // Initial load
  buildQueue();
  currentIndex = nextIndex();
  showQuote(currentIndex, false);

  document.getElementById('shuffleBtn').addEventListener('click', () => {
    currentIndex = nextIndex();
    showQuote(currentIndex, true);
  });

  // Navbar toggle
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');
  navToggle.addEventListener('click', () => {
    navToggle.classList.toggle('open');
    navLinks.classList.toggle('open');
  });
  navLinks.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      navToggle.classList.remove('open');
      navLinks.classList.remove('open');
    });
  });
